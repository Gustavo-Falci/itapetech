{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITape Tech | High-End Computing</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Syne:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav>
        <div class="logo" data-url="{% url 'index' %}" onclick="location.href=this.dataset.url" style="cursor: pointer;">
            ITape<span>Tech</span>
        </div>

        <div class="nav-links">
            <a href="{% url 'index' %}" class="nav-link-home">
                <span class="brackets">[</span> Home <span class="brackets">]</span>
            </a>
            
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="btn-nav">
                    <i class="fas fa-terminal"></i> PAINEL
                </a>
            {% else %}
                <a href="{% url 'login' %}" class="btn-nav-login">LOGIN</a>
                
                <a href="{% url 'register' %}" class="btn-nav-register">
                    CRIAR CONTA <i class="fas fa-arrow-right"></i>
                </a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <a href="https://wa.me/5515998089768" target="_blank" class="whatsapp-float">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
    </script>
</body>
</html>
